version: "3"
networks:
  expense:
volumes:
  mysql: # docker volume create mysql
services:
  mysql:
    image: muneer092/mysql:v1
    container_name: mysql
    volumes:
    - mysql:/var/lib/mysql #equals to -v mysql:/var/lib/mysql
  backend: 
    image: muneer092/backend:v1
    container_name: backend
    command: sh -c "sleep 10 && node /opt/server/index.js"
    depends_on:
    - mysql
  frontend:
    image: muneer092/frontend:v1
    container_name: frontend
    depends_on:
    - backend
    ports:
    - 80:80
